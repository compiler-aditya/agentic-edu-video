[project]
name = "eduvideo"
version = "0.1.0"
description = "Agentic AI pipeline that turns a school topic into a narrated, captioned educational video in Indian languages"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.2.8",
    "freetype-py>=2.5.1",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uharfbuzz>=0.56.2",
]

[project.scripts]
eduvideo = "eduvideo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
